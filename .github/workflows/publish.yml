name: Publish

on:
  push:
    tags: ["v*"]

# Every job starts read-only. The publish job adds the one permission it needs.
permissions:
  contents: read

jobs:
  # A tag can point at a commit CI never saw, so the release runs the full chain itself, on both
  # systems CI covers, before anything reaches the registry.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: npm test
        run: npm test

      - name: Per-agent rule copies match AGENTS.md
        run: node scripts/sync-rules.mjs --check

  publish:
    needs: test
    runs-on: ubuntu-latest
    # The environment holds the required reviewer, so a pushed tag waits for an approval before
    # this job, the only one that can reach the registry, starts.
    environment: npm

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Staged publishing needs a recent npm, and the runner image lags behind. The version is
      # exact because this job holds the publishing identity. Raise it by hand.
      - name: Use an npm that stages
        run: npm install -g npm@11.21.0

      - name: The tag must be the version being published
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag $tag, package.json $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json v$pkg."
            exit 1
          fi

      - name: Skip a version the registry already holds
        run: |
          name=$(node -p "require('./package.json').name")
          ver=$(node -p "require('./package.json').version")
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver is already on the registry. Nothing to publish."
            echo "PUBLISHED=yes" >> "$GITHUB_ENV"
          fi

      # The release is staged, not published. It reaches the registry only after a maintainer
      # runs npm stage approve with two-factor authentication, so this workflow alone cannot ship.
      # --provenance signs the tarball against this workflow and commit, so anyone installing it
      # can verify where it was built. It needs the id-token permission granted above.
      - name: Stage the release
        if: env.PUBLISHED != 'yes'
        run: npm stage publish --provenance
