name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository, so no job gets more than a read of it.
permissions:
  contents: read

jobs:
  check:
    # Most of what install does is paths and directories, and most Roblox developers are on
    # Windows, so the checks run on both rather than on the one that happens to be cheapest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The two Node.js release lines still in support, the older of which package.json promises.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # The same chain a release is held to: version drift, the structural audit, and the test
      # suite, so nothing passes here that npm test would stop.
      - name: npm test
        run: npm test

      - name: Per-agent rule copies match AGENTS.md
        run: node scripts/sync-rules.mjs --check

      # Catches a package that would publish tests or evals, or lose a module the CLI imports,
      # before a tag publishes it rather than after.
      - name: Package holds what it should, and nothing else
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        shell: bash
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const fs = require("fs");
            const files = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))[0].files.map((f) => f.path);
            const stray = files.filter((p) => /^(test|evals)\/|\/evals\//.test(p));
            const missing = fs.readdirSync("scripts/lib").map((n) => `scripts/lib/${n}`).filter((p) => !files.includes(p));
            for (const p of stray) console.log(`::error::ships ${p}, which is not for users`);
            for (const p of missing) console.log(`::error::does not ship ${p}, which the CLI imports`);
            process.exit(stray.length + missing.length > 0 ? 1 : 0);
          ' "$RUNNER_TEMP/pack.json"

      - name: Shipped changes require a version bump
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24' && github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="origin/$BASE_REF"
          shipped="skills agents hooks scripts rules AGENTS.md QWEN.md package.json plugin.json
            mcp.json mcp_config.json qwen-extension.json .claude-plugin .codex-plugin
            .cursor-plugin .agents .github/plugin .github/agents .github/copilot-instructions.md
            .cursor .windsurf .devin .kiro .qoder .clinerules"
          changed=$(git diff --name-only "$base"...HEAD -- $shipped)
          if [ -z "$changed" ]; then
            echo "No shipped files changed."
            exit 0
          fi
          old=$(git show "$base:package.json" | jq -r .version)
          new=$(jq -r .version package.json)
          echo "Changed:"; echo "$changed" | sed 's/^/  /'
          echo "Version: $old -> $new"
          highest=$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)
          if [ "$old" = "$new" ] || [ "$highest" != "$new" ]; then
            echo "::error::These files ship to users, so the version must be raised above $old."
            exit 1
          fi
